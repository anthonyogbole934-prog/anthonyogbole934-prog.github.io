title: SoloStack
description: Practical AI tools, software reviews and online income ideas for freelancers, remote workers and solo business owners.
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
permalink: /:title/
header_pages:
  - about.md
  - privacy.md
  - disclaimer.md
exclude:
  - blog_manager.py
  - data
  - requirements.txt
  - affiliates.json
  - SETUP_GUIDE.md
  - workflow_copy.yml
